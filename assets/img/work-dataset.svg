<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Occlusion-aware dataset generator</title>
  <desc id="desc">A dark pipeline diagram showing source objects being extracted, isolated and composited into synthetic training scenes.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1a1f25" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9bd64a"/>
    </marker>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d24"/>
      <stop offset="1" stop-color="#10151b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="#0b0d10"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".55"/>

  <text x="64" y="70" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2.4">EXTRACT</text>
  <text x="420" y="70" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2.4">ISOLATE</text>
  <text x="760" y="70" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2.4">COMPOSITE</text>
  <text x="1030" y="70" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2.4">EXPORT</text>
  <line x1="64" y1="86" x2="1136" y2="86" stroke="#252c34"/>

  <!-- source tiles -->
  <g>
    <rect x="64" y="140" width="156" height="156" rx="10" fill="url(#tile)" stroke="#2b333d"/>
    <circle cx="142" cy="196" r="24" fill="#3a4652"/>
    <path d="M112 252 Q142 226 172 252 L180 296 L158 296 L154 268 L130 268 L126 296 L104 296 Z" fill="#3a4652"/>
    <text x="76" y="278" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">PERSON / 01</text>

    <rect x="64" y="322" width="156" height="156" rx="10" fill="url(#tile)" stroke="#2b333d"/>
    <rect x="104" y="378" width="76" height="42" rx="8" fill="#3a4652"/>
    <circle cx="120" cy="426" r="12" fill="#0b0d10" stroke="#4c5966"/>
    <circle cx="164" cy="426" r="12" fill="#0b0d10" stroke="#4c5966"/>
    <text x="76" y="460" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">VEHICLE / 02</text>

    <rect x="64" y="504" width="156" height="156" rx="10" fill="url(#tile)" stroke="#2b333d"/>
    <rect x="112" y="556" width="60" height="54" rx="4" fill="#3a4652"/>
    <line x1="122" y1="556" x2="122" y2="610" stroke="#0b0d10" stroke-width="6"/>
    <line x1="162" y1="556" x2="162" y2="610" stroke="#0b0d10" stroke-width="6"/>
    <text x="76" y="642" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">OBJECT / 03</text>
  </g>

  <!-- arrows to isolate -->
  <g stroke="#9bd64a" stroke-width="1.2" fill="none" marker-end="url(#arrow)" opacity=".8">
    <path d="M232 218 H360"/>
    <path d="M232 400 H360"/>
    <path d="M232 582 H360"/>
  </g>

  <!-- isolate panel -->
  <rect x="376" y="140" width="300" height="520" rx="14" fill="#0f1318" stroke="#2b333d"/>
  <text x="398" y="174" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.5">BACKGROUND REMOVAL</text>
  <g>
    <rect x="410" y="204" width="232" height="192" rx="8" fill="#131820" stroke="#28303a"/>
    <path d="M412 396 L520 204 M642 204 L520 396" stroke="#1f262e"/>
    <circle cx="526" cy="266" r="30" fill="#3a4652"/>
    <path d="M482 340 Q526 306 570 340 L584 396 L552 396 L546 358 L506 358 L500 396 L468 396 Z" fill="#3a4652"/>
    <path d="M440 396 L520 300 M600 396 L536 312" stroke="#9bd64a" stroke-width="1" stroke-dasharray="4 4" opacity=".65"/>
    <text x="422" y="384" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">ALPHA</text>
  </g>
  <g>
    <rect x="410" y="420" width="232" height="66" rx="6" fill="#131820" stroke="#28303a"/>
    <text x="424" y="444" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.2">MASK</text>
    <rect x="424" y="454" width="204" height="18" rx="3" fill="#1c232b"/>
    <rect x="424" y="454" width="146" height="18" rx="3" fill="#9bd64a" opacity=".55"/>
    <text x="424" y="478" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.2">OBJECT CUTOUT READY</text>
  </g>

  <!-- arrow to composite -->
  <path d="M688 400 H744" stroke="#9bd64a" stroke-width="1.2" fill="none" marker-end="url(#arrow)" opacity=".8"/>

  <!-- composite canvas -->
  <g>
    <rect x="760" y="140" width="300" height="520" rx="14" fill="#0f1318" stroke="#2b333d"/>
    <text x="782" y="174" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.5">SYNTHETIC SCENE</text>
    <rect x="782" y="196" width="256" height="330" rx="8" fill="#131820" stroke="#28303a"/>
    <line x1="782" y1="430" x2="1038" y2="430" stroke="#28303a"/>
    <g>
      <circle cx="850" cy="300" r="22" fill="#3a4652"/>
      <path d="M818 360 Q850 334 882 360 L892 430 L866 430 L862 386 L838 386 L834 430 L808 430 Z" fill="#3a4652"/>
    </g>
    <g>
      <rect x="910" y="358" width="90" height="40" rx="7" fill="#3a4652"/>
      <circle cx="928" cy="400" r="10" fill="#0b0d10" stroke="#4c5966"/>
      <circle cx="982" cy="400" r="10" fill="#0b0d10" stroke="#4c5966"/>
    </g>
    <g>
      <rect x="890" y="270" width="34" height="160" fill="#211916" stroke="#5c3b30"/>
      <rect x="812" y="352" width="150" height="34" fill="#211916" stroke="#5c3b30"/>
    </g>
    <g stroke="#9bd64a" fill="none" stroke-width="1.1" stroke-dasharray="5 4" opacity=".8">
      <rect x="804" y="272" width="104" height="158"/>
      <rect x="900" y="350" width="108" height="58"/>
    </g>
    <text x="782" y="552" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">OCCLUSION RATIO / CONTROLLED</text>
  </g>

  <!-- export stack -->
  <path d="M1084 400 H1100" stroke="#9bd64a" stroke-width="1.2" fill="none" marker-end="url(#arrow)" opacity=".8"/>
  <g>
    <rect x="1104" y="230" width="20" height="340" rx="4" fill="#1a222a" stroke="#2b333d"/>
    <rect x="1112" y="222" width="20" height="340" rx="4" fill="#1f2831" stroke="#2b333d"/>
    <rect x="1120" y="214" width="20" height="340" rx="4" fill="#24303a" stroke="#3a4652"/>
    <text x="1098" y="592" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">N / FRAMES</text>
  </g>

  <!-- footer -->
  <text x="64" y="708" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2">DATA DESIGN / OCCLUSION-AWARE TRAINING SET</text>
  <text x="1136" y="708" text-anchor="end" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2">2024</text>
</svg>
