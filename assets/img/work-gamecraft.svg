<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">GameCraft cloud platform</title>
  <desc id="desc">A dark architecture diagram of the GameCraft platform with a browser client, API layer, cloud services and community voting cards.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1a1f25" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9bd64a"/>
    </marker>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182028"/>
      <stop offset="1" stop-color="#11161c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="#0b0d10"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".55"/>

  <text x="60" y="62" fill="#ecebe6" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="2.2">GAMECRAFT</text>
  <text x="60" y="84" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" letter-spacing="1.6">COMMUNITY PLATFORM / CLOUD ARCHITECTURE</text>
  <text x="1140" y="72" text-anchor="end" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" letter-spacing="1.8">2023</text>
  <line x1="60" y1="102" x2="1140" y2="102" stroke="#252c34"/>

  <!-- client -->
  <g>
    <rect x="60" y="184" width="284" height="392" rx="14" fill="#0f1318" stroke="#2b333d"/>
    <rect x="60" y="184" width="284" height="34" rx="14" fill="#151b22"/>
    <circle cx="82" cy="201" r="4" fill="#d98a6a"/>
    <circle cx="96" cy="201" r="4" fill="#6f767d"/>
    <circle cx="110" cy="201" r="4" fill="#6f767d"/>
    <text x="132" y="205" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">GAMECRAFT / BROWSE</text>

    <text x="82" y="252" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">COMMUNITY IDEAS</text>
    <g>
      <rect x="82" y="268" width="240" height="66" rx="7" fill="#141a21" stroke="#28303a"/>
      <rect x="96" y="284" width="34" height="34" rx="5" fill="#24303a"/>
      <text x="142" y="296" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">Neon Drift</text>
      <text x="142" y="312" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1">RACING / ARCADE</text>
      <path d="M292 288 L300 296 L292 304" stroke="#9bd64a" fill="none"/>
    </g>
    <g>
      <rect x="82" y="346" width="240" height="66" rx="7" fill="#141a21" stroke="#28303a"/>
      <rect x="96" y="362" width="34" height="34" rx="5" fill="#24303a"/>
      <text x="142" y="374" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">Garden Keep</text>
      <text x="142" y="390" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1">PUZZLE / COZY</text>
      <path d="M292 366 L300 374 L292 382" stroke="#9bd64a" fill="none"/>
    </g>
    <g>
      <rect x="82" y="424" width="240" height="66" rx="7" fill="#141a21" stroke="#4d6a2a"/>
      <rect x="96" y="440" width="34" height="34" rx="5" fill="#24303a"/>
      <text x="142" y="452" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">Signal Lost</text>
      <text x="142" y="468" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1">HORROR / NARRATIVE</text>
      <path d="M292 444 L300 452 L292 460" stroke="#9bd64a" fill="none"/>
    </g>
    <rect x="82" y="516" width="240" height="36" rx="18" fill="#9bd64a"/>
    <text x="202" y="539" text-anchor="middle" fill="#071004" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" font-weight="700" letter-spacing="1.6">SUBMIT AN IDEA</text>
  </g>

  <!-- client to api -->
  <path d="M344 380 H404" stroke="#9bd64a" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <text x="354" y="368" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.1">HTTPS</text>

  <!-- api -->
  <g>
    <rect x="410" y="316" width="160" height="128" rx="12" fill="url(#node)" stroke="#4d6a2a"/>
    <circle cx="436" cy="342" r="5" fill="#9bd64a"/>
    <text x="450" y="346" fill="#ecebe6" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="1.6">API</text>
    <text x="430" y="376" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.2">AUTH</text>
    <text x="430" y="396" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.2">IDEAS</text>
    <text x="430" y="416" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.2">VOTES</text>
  </g>

  <!-- api to cloud -->
  <path d="M570 380 H638" stroke="#9bd64a" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <text x="580" y="368" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.1">REST</text>

  <!-- cloud -->
  <g>
    <rect x="644" y="156" width="456" height="464" rx="16" fill="#0d1116" stroke="#2b333d" stroke-dasharray="7 7"/>
    <text x="668" y="188" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" letter-spacing="1.8">CLOUD / MANAGED SERVICES</text>

    <g>
      <rect x="668" y="214" width="190" height="86" rx="9" fill="#131820" stroke="#28303a"/>
      <text x="686" y="240" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">COMPUTE</text>
      <text x="686" y="262" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Functions</text>
      <text x="686" y="280" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.1">EVENT-DRIVEN LOGIC</text>
    </g>

    <g>
      <rect x="878" y="214" width="190" height="86" rx="9" fill="#131820" stroke="#28303a"/>
      <text x="896" y="240" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">DATA</text>
      <text x="896" y="262" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Cosmos DB</text>
      <text x="896" y="280" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.1">IDEAS / VOTES / USERS</text>
    </g>

    <g>
      <rect x="668" y="320" width="190" height="86" rx="9" fill="#131820" stroke="#28303a"/>
      <text x="686" y="346" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">IDENTITY</text>
      <text x="686" y="368" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Auth</text>
      <text x="686" y="386" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.1">REGISTRATION / SESSIONS</text>
    </g>

    <g>
      <rect x="878" y="320" width="190" height="86" rx="9" fill="#131820" stroke="#28303a"/>
      <text x="896" y="346" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">MEDIA</text>
      <text x="896" y="368" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Storage</text>
      <text x="896" y="386" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.1">COVERS / BUILDS</text>
    </g>

    <!-- community votes -->
    <text x="668" y="444" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">COMMUNITY REVIEW</text>
    <g>
      <rect x="668" y="458" width="56" height="56" rx="28" fill="#1d262e" stroke="#3a4652"/>
      <text x="696" y="491" text-anchor="middle" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9">+1</text>
      <rect x="736" y="458" width="56" height="56" rx="28" fill="#1d262e" stroke="#3a4652"/>
      <text x="764" y="491" text-anchor="middle" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9">+1</text>
      <rect x="804" y="458" width="56" height="56" rx="28" fill="#1d262e" stroke="#3a4652"/>
      <text x="832" y="491" text-anchor="middle" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9">+1</text>
      <rect x="872" y="458" width="56" height="56" rx="28" fill="#202a18" stroke="#4d6a2a"/>
      <text x="900" y="491" text-anchor="middle" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9">+1</text>
      <text x="944" y="490" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5" letter-spacing="1.2">VOTE</text>
    </g>

    <path d="M763 300 V320 M973 300 V320" stroke="#3a4652" stroke-dasharray="4 4"/>
    <path d="M763 406 V458 M973 406 V458" stroke="#3a4652" stroke-dasharray="4 4"/>
  </g>

  <!-- bottom caption -->
  <text x="60" y="706" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2">FULL-STACK / CLOUD APPLICATION DEVELOPMENT</text>
  <text x="1140" y="706" text-anchor="end" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2">TEAM PROJECT</text>
</svg>
