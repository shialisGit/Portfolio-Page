<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid images and convolution</title>
  <desc id="desc">A dark visual explanation of low-frequency and high-frequency image information combining into a hybrid image, with waveform diagrams below.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1a1f25" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="low" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98a6a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9bd64a" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b22"/>
      <stop offset="1" stop-color="#0f1318"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="#0b0d10"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".55"/>

  <!-- low frequency panel -->
  <g>
    <rect x="54" y="96" width="310" height="390" rx="14" fill="url(#panel)" stroke="#2b333d"/>
    <text x="76" y="128" fill="#d98a6a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" letter-spacing="2">LOW FREQUENCY</text>
    <g filter="url(#blur)" opacity=".9">
      <ellipse cx="209" cy="292" rx="96" ry="124" fill="url(#low)"/>
      <circle cx="176" cy="258" r="10" fill="#ecebe6" opacity=".8"/>
      <circle cx="242" cy="258" r="10" fill="#ecebe6" opacity=".8"/>
      <path d="M172 342 Q209 364 246 342" stroke="#ecebe6" stroke-width="8" fill="none" opacity=".55"/>
    </g>
    <text x="76" y="454" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">GAUSSIAN BLUR / STRUCTURE</text>
  </g>

  <text x="386" y="302" fill="#8b9096" font-family="'Inter', sans-serif" font-size="42" font-weight="300">+</text>

  <!-- high frequency panel -->
  <g>
    <rect x="430" y="96" width="310" height="390" rx="14" fill="url(#panel)" stroke="#2b333d"/>
    <text x="452" y="128" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" letter-spacing="2">HIGH FREQUENCY</text>
    <g fill="none" stroke="#9bd64a" stroke-width="1.1" opacity=".8">
      <ellipse cx="585" cy="292" rx="96" ry="124"/>
      <ellipse cx="585" cy="292" rx="82" ry="108" opacity=".5"/>
      <circle cx="552" cy="258" r="10"/>
      <circle cx="618" cy="258" r="10"/>
      <path d="M548 342 Q585 364 622 342"/>
      <path d="M520 220 Q585 170 650 220" opacity=".4"/>
      <path d="M508 374 Q585 414 662 374" opacity=".4"/>
      <path d="M489 292 H681" stroke-dasharray="3 6" opacity=".3"/>
      <path d="M585 168 V416" stroke-dasharray="3 6" opacity=".3"/>
    </g>
    <text x="452" y="454" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">EDGES / DETAIL</text>
  </g>

  <text x="762" y="302" fill="#8b9096" font-family="'Inter', sans-serif" font-size="42" font-weight="300">=</text>

  <!-- hybrid panel -->
  <g>
    <rect x="806" y="96" width="340" height="390" rx="14" fill="url(#panel)" stroke="#4d6a2a"/>
    <text x="828" y="128" fill="#ecebe6" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" letter-spacing="2">HYBRID IMAGE</text>
    <g filter="url(#blur)" opacity=".85">
      <ellipse cx="976" cy="292" rx="104" ry="132" fill="url(#low)"/>
    </g>
    <g fill="none" stroke="#ecebe6" stroke-width="1" opacity=".7">
      <ellipse cx="976" cy="292" rx="96" ry="124"/>
      <circle cx="943" cy="258" r="10"/>
      <circle cx="1009" cy="258" r="10"/>
      <path d="M939 342 Q976 364 1013 342"/>
    </g>
    <text x="828" y="454" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">PERCEPTION CHANGES WITH DISTANCE</text>
  </g>

  <!-- waveform strip -->
  <g>
    <line x1="54" y1="540" x2="1146" y2="540" stroke="#252c34"/>
    <text x="54" y="574" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">SIGNAL</text>

    <g fill="none" stroke-width="1.5">
      <path d="M150 620 C190 580 230 580 270 620 S350 660 390 620 S470 580 510 620 S590 660 630 620 S710 580 750 620 S830 660 870 620 S950 580 990 620 S1070 660 1110 620" stroke="#d98a6a" opacity=".75"/>
      <path d="M150 620 C160 610 170 630 180 620 S200 610 210 620 S230 630 240 620 S260 610 270 620 S290 630 300 620 S320 610 330 620 S350 630 360 620 S380 610 390 620 S410 630 420 620 S440 610 450 620 S470 630 480 620 S500 610 510 620 S530 630 540 620 S560 610 570 620 S590 630 600 620 S620 610 630 620 S650 630 660 620 S680 610 690 620 S710 630 720 620 S740 610 750 620 S770 630 780 620 S800 610 810 620 S830 630 840 620 S860 610 870 620 S890 630 900 620 S920 610 930 620 S950 630 960 620 S980 610 990 620 S1010 630 1020 620 S1040 610 1050 620 S1070 630 1080 620 S1100 610 1110 620" stroke="#9bd64a" opacity=".9"/>
    </g>

    <line x1="150" y1="684" x2="1110" y2="684" stroke="#252c34" stroke-dasharray="4 6"/>
    <text x="150" y="706" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">LOW PASS</text>
    <text x="580" y="706" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">HIGH PASS</text>
    <text x="1060" y="706" text-anchor="end" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.3">COMBINED</text>
  </g>
</svg>
