<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Occlusion-aware object recognition</title>
  <desc id="desc">A dark technical diagram of an object detector identifying a partly hidden person, with a side panel showing clear, partial and occluded views.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1a1f25" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bd64a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9bd64a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#0b0d10"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".55"/>

  <!-- camera frame -->
  <g>
    <rect x="64" y="88" width="724" height="574" rx="16" fill="#0f1318" stroke="#252c34"/>
    <rect x="64" y="88" width="724" height="574" rx="16" fill="url(#fade)" opacity=".35"/>
    <line x1="64" y1="140" x2="788" y2="140" stroke="#252c34"/>
    <text x="88" y="120" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="2.4">CAM 01 / LIVE</text>
    <circle cx="740" cy="114" r="4" fill="#9bd64a"/>
    <text x="707" y="118" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="1.6">REC</text>

    <!-- background scene -->
    <rect x="100" y="470" width="650" height="150" fill="#131820"/>
    <line x1="100" y1="470" x2="750" y2="470" stroke="#2b333d"/>
    <rect x="128" y="300" width="120" height="170" fill="#161c24" stroke="#2b333d"/>
    <rect x="150" y="330" width="22" height="30" fill="#242d37"/>
    <rect x="196" y="330" width="22" height="30" fill="#242d37"/>
    <rect x="150" y="386" width="22" height="30" fill="#242d37"/>
    <rect x="196" y="386" width="22" height="30" fill="#242d37"/>

    <!-- target person -->
    <g>
      <circle cx="452" cy="257" r="37" fill="#303b46"/>
      <path d="M407 310 Q452 282 497 310 L514 470 L482 470 L476 405 L428 405 L422 470 L390 470 Z" fill="#303b46"/>
      <path d="M414 334 L390 406 M490 334 L514 406" stroke="#303b46" stroke-width="22" stroke-linecap="round"/>
    </g>

    <!-- secondary objects -->
    <g opacity=".9">
      <rect x="606" y="450" width="128" height="54" rx="12" fill="#232c35"/>
      <circle cx="628" cy="506" r="16" fill="#151b22" stroke="#343e48"/>
      <circle cx="712" cy="506" r="16" fill="#151b22" stroke="#343e48"/>
      <rect x="620" y="458" width="42" height="20" rx="4" fill="#2b353f"/>
    </g>

    <!-- occluders -->
    <rect x="312" y="140" width="34" height="486" fill="#151a21" stroke="#3a2b26"/>
    <rect x="268" y="420" width="342" height="58" fill="#211916" stroke="#5c3b30"/>
    <rect x="424" y="360" width="58" height="164" fill="#1b1512" stroke="#5c3b30" opacity=".95"/>
    <text x="276" y="456" fill="#d98a6a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" letter-spacing="1.6">OCCLUDER</text>

    <!-- target box -->
    <g stroke="#9bd64a" fill="none">
      <rect x="374" y="193" width="172" height="380" stroke-width="1.4" stroke-dasharray="7 6" opacity=".9"/>
      <path d="M374 222V193H403 M517 193H546V222 M374 544V573H403 M517 573H546V544" stroke-width="3"/>
    </g>
    <rect x="374" y="164" width="128" height="22" rx="3" fill="#9bd64a"/>
    <text x="384" y="180" fill="#0a0d07" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="1.4">TRACK 01</text>

    <!-- car box -->
    <g stroke="#9bd64a" fill="none" opacity=".72">
      <rect x="592" y="436" width="158" height="86" stroke-width="1.2" stroke-dasharray="5 5"/>
      <path d="M592 452V436H610 M732 436H750V452 M592 506V522H610 M732 522H750V506" stroke-width="2"/>
    </g>
    <rect x="592" y="414" width="58" height="17" rx="2" fill="#202a18" stroke="#4d6a2a"/>
    <text x="599" y="426" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">VEHICLE</text>

    <!-- crosshair -->
    <g stroke="#9bd64a" opacity=".34">
      <line x1="460" y1="360" x2="460" y2="388"/>
      <line x1="446" y1="374" x2="474" y2="374"/>
    </g>
  </g>

  <!-- side panel -->
  <g>
    <rect x="828" y="88" width="308" height="574" rx="16" fill="#0f1318" stroke="#252c34"/>
    <text x="854" y="124" fill="#ecebe6" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="2.2">OCCLUSION MAP</text>
    <line x1="854" y1="142" x2="1110" y2="142" stroke="#252c34"/>

    <!-- three mini frames -->
    <g>
      <rect x="854" y="168" width="256" height="124" rx="8" fill="#131820" stroke="#28303a"/>
      <circle cx="920" cy="218" r="16" fill="#394550"/>
      <path d="M898 250 Q920 234 942 250 L948 286 L928 286 L926 264 L914 264 L912 286 L892 286 Z" fill="#394550"/>
      <rect x="1010" y="202" width="84" height="84" fill="#1b1512" stroke="#3a2b26"/>
      <text x="862" y="310" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.5">CLEAR</text>
      <text x="1062" y="310" fill="#d98a6a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.5">UNSEEN</text>
    </g>

    <g>
      <rect x="854" y="330" width="256" height="124" rx="8" fill="#131820" stroke="#28303a"/>
      <circle cx="930" cy="380" r="16" fill="#394550"/>
      <path d="M908 412 Q930 396 952 412 L958 448 L938 448 L936 426 L924 426 L922 448 L902 448 Z" fill="#394550"/>
      <rect x="1002" y="364" width="66" height="84" fill="#1b1512" stroke="#3a2b26"/>
      <text x="862" y="472" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.5">PARTIAL</text>
      <text x="1050" y="472" fill="#d98a6a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.5">MASKED</text>
    </g>

    <g>
      <rect x="854" y="492" width="256" height="124" rx="8" fill="#131820" stroke="#28303a"/>
      <circle cx="980" cy="542" r="16" fill="#394550" opacity=".3"/>
      <path d="M958 574 Q980 558 1002 574 L1008 610 L988 610 L986 588 L974 588 L972 610 L952 610 Z" fill="#394550" opacity=".3"/>
      <rect x="948" y="516" width="96" height="84" fill="#1b1512" stroke="#5c3b30"/>
      <text x="862" y="634" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.5">OCCLUDED</text>
      <text x="1054" y="634" fill="#d98a6a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.5">LOST</text>
    </g>
  </g>

  <!-- footer -->
  <text x="64" y="704" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2">ROBUST PERCEPTION / OCCLUDED OBJECT RECOGNITION</text>
  <text x="1136" y="704" text-anchor="end" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2">2024</text>
</svg>
