<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Quiplash multiplayer remake</title>
  <desc id="desc">A dark real-time game interface with a prompt card, three player answer cards, scores and a cloud service pipeline.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1a1f25" stroke-width="1"/>
    </pattern>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c242c"/>
      <stop offset="1" stop-color="#12171d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9bd64a"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#0b0d10"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity=".55"/>

  <!-- top bar -->
  <text x="54" y="58" fill="#ecebe6" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" letter-spacing="2.4">QUIPLASH</text>
  <text x="54" y="80" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.6">REAL-TIME MULTIPLAYER / ROUND 02</text>
  <g>
    <rect x="1010" y="44" width="136" height="32" rx="16" fill="#202a18" stroke="#4d6a2a"/>
    <circle cx="1030" cy="60" r="4" fill="#9bd64a"/>
    <text x="1044" y="64" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">LIVE SYNC</text>
  </g>
  <line x1="54" y1="102" x2="1146" y2="102" stroke="#252c34"/>

  <!-- players -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">
    <text x="54" y="136" fill="#6f767d">PLAYERS</text>
    <circle cx="56" cy="162" r="12" fill="#3a4652"/><text x="52" y="166" fill="#ecebe6">A</text>
    <circle cx="90" cy="162" r="12" fill="#3a4652"/><text x="86" y="166" fill="#ecebe6">B</text>
    <circle cx="124" cy="162" r="12" fill="#3a4652"/><text x="120" y="166" fill="#ecebe6">C</text>
    <circle cx="158" cy="162" r="12" fill="#24303a" stroke="#3a4652"/><text x="154" y="166" fill="#6f767d">+</text>
    <text x="1146" y="166" text-anchor="end" fill="#6f767d">SCORES</text>
  </g>

  <!-- prompt -->
  <g>
    <rect x="54" y="196" width="1092" height="126" rx="14" fill="url(#prompt)" stroke="#3a4652"/>
    <text x="80" y="228" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="1.8">PROMPT / 02</text>
    <text x="80" y="270" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="20" font-weight="600" letter-spacing="-.3">The worst thing to bring to a job interview is ____</text>
    <text x="80" y="298" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.2">ALL PLAYERS ANSWER / THEN VOTE</text>
    <rect x="1040" y="222" width="78" height="78" rx="39" fill="#131820" stroke="#4d6a2a"/>
    <text x="1079" y="262" text-anchor="middle" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20">36</text>
    <text x="1079" y="280" text-anchor="middle" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7" letter-spacing="1">SECONDS</text>
  </g>

  <!-- answer cards -->
  <g>
    <rect x="54" y="358" width="344" height="190" rx="14" fill="#131820" stroke="#4d6a2a"/>
    <text x="78" y="390" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">PLAYER A</text>
    <text x="78" y="438" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="16" font-weight="500">“A readable</text>
    <text x="78" y="464" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="16" font-weight="500">annual report.”</text>
    <rect x="78" y="496" width="120" height="30" rx="15" fill="#9bd64a"/>
    <text x="138" y="516" text-anchor="middle" fill="#071004" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" font-weight="700" letter-spacing="1.4">VOTE</text>

    <rect x="428" y="358" width="344" height="190" rx="14" fill="#131820" stroke="#28303a"/>
    <text x="452" y="390" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">PLAYER B</text>
    <text x="452" y="438" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="16" font-weight="500">“My browser</text>
    <text x="452" y="464" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="16" font-weight="500">history.”</text>
    <rect x="452" y="496" width="120" height="30" rx="15" fill="#1c232b" stroke="#28303a"/>
    <text x="512" y="516" text-anchor="middle" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">VOTE</text>

    <rect x="802" y="358" width="344" height="190" rx="14" fill="#131820" stroke="#28303a"/>
    <text x="826" y="390" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">PLAYER C</text>
    <text x="826" y="438" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="16" font-weight="500">“A confident</text>
    <text x="826" y="464" fill="#ecebe6" font-family="'Inter', sans-serif" font-size="16" font-weight="500">opinion.”</text>
    <rect x="826" y="496" width="120" height="30" rx="15" fill="#1c232b" stroke="#28303a"/>
    <text x="886" y="516" text-anchor="middle" fill="#8b9096" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">VOTE</text>
  </g>

  <!-- pipeline -->
  <g>
    <text x="54" y="604" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.4">SYSTEM PATH</text>
    <line x1="54" y1="624" x2="1146" y2="624" stroke="#252c34"/>

    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1.1">
      <rect x="54" y="648" width="190" height="44" rx="7" fill="#131820" stroke="#28303a"/>
      <text x="72" y="675" fill="#ecebe6">CLIENT</text>

      <path d="M244 670 H316" stroke="#9bd64a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="320" y="648" width="210" height="44" rx="7" fill="#131820" stroke="#28303a"/>
      <text x="338" y="675" fill="#ecebe6">EXPRESS API</text>

      <path d="M530 670 H602" stroke="#9bd64a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="606" y="648" width="256" height="44" rx="7" fill="#131820" stroke="#28303a"/>
      <text x="624" y="675" fill="#ecebe6">AZURE FUNCTIONS</text>

      <path d="M862 670 H934" stroke="#9bd64a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="938" y="648" width="208" height="44" rx="7" fill="#202a18" stroke="#4d6a2a"/>
      <text x="956" y="675" fill="#9bd64a">COSMOS DB</text>
    </g>
  </g>

  <text x="54" y="724" fill="#6f767d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" letter-spacing="1.8">REAL-TIME STATE / CLOUD SERVICES / GAME LOOP</text>
  <text x="1146" y="724" text-anchor="end" fill="#9bd64a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" letter-spacing="1.8">2023</text>
</svg>
